<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="robots" content="noindex, nofollow" />
    <title>玩擲 Dashboard</title>
    <link rel="icon" href="/icon-192.png" />
    <link rel="stylesheet" href="/dashboard.css" />
    <script src="/dashboard.js" defer></script>
  </head>
  <body>
    <main id="login" class="login" hidden>
      <img src="/icon-192.png" alt="" width="64" height="64" />
      <h1>玩擲 Dashboard</h1>
      <form id="login-form">
        <label for="password">Dashboard password</label>
        <input id="password" type="password" autocomplete="current-password" required />
        <button type="submit">Log in</button>
        <p id="login-error" class="error" role="alert"></p>
      </form>
    </main>

    <div id="app" class="page" hidden>
      <header class="top">
        <img src="/icon-192.png" alt="" width="40" height="40" />
        <h1>玩擲 Dashboard</h1>
        <button id="refresh" class="quiet" type="button">Refresh</button>
        <button id="logout" class="quiet" type="button">Log out</button>
      </header>
      <p id="page-error" class="error" role="alert"></p>

      <section aria-labelledby="gemini-title">
        <div class="section-head">
          <h2 id="gemini-title">Gemini API</h2>
          <span id="gemini-state" class="status"></span>
          <button id="gemini-check" type="button">Test now</button>
        </div>
        <p id="gemini-check-result" class="note" role="status"></p>
        <div class="tiles">
          <div class="tile"><span class="label">Model</span><strong id="g-model" class="small-value"></strong></div>
          <div class="tile"><span class="label">Calls today</span><strong id="g-today"></strong><span id="g-limit" class="sub"></span></div>
          <div class="tile"><span class="label">Succeeded</span><strong id="g-ok"></strong><span class="sub">since last restart</span></div>
          <div class="tile"><span class="label">Failed</span><strong id="g-failed"></strong><span class="sub">since last restart</span></div>
          <div class="tile"><span class="label">Last success</span><strong id="g-last-ok" class="small-value"></strong></div>
          <div class="tile"><span class="label">Last error</span><strong id="g-last-error" class="small-value"></strong><span id="g-last-error-at" class="sub"></span></div>
        </div>
      </section>

      <section aria-labelledby="users-title">
        <div class="section-head">
          <h2 id="users-title">Users</h2>
          <input id="search" type="search" placeholder="Search email or nickname" aria-label="Search users" />
        </div>
        <div class="tiles">
          <div class="tile"><span class="label">Total users</span><strong id="t-users"></strong></div>
          <div class="tile"><span class="label">New in 7 days</span><strong id="t-new"></strong></div>
          <div class="tile"><span class="label">Games played</span><strong id="t-plays"></strong></div>
          <div class="tile"><span class="label">Chat messages</span><strong id="t-messages"></strong></div>
        </div>
        <div class="table-wrap">
          <table>
            <thead>
              <tr><th>Nickname</th><th>Email</th><th>Joined</th><th class="num">Saved</th><th class="num">Plays</th><th class="num">Messages</th><th>Last played</th></tr>
            </thead>
            <tbody id="users"></tbody>
          </table>
        </div>
        <p id="empty" class="note" hidden>No users found.</p>
        <div class="pager">
          <span id="range" class="note"></span>
          <button id="prev" class="quiet" type="button">Previous</button>
          <button id="next" class="quiet" type="button">Next</button>
        </div>
      </section>
    </div>
  </body>
</html>
