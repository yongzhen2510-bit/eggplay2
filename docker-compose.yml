# One command deploys the website, the API and the database:
#   cp .env.example .env   (then fill it in)
#   docker compose up -d --build
# No container publishes a port, so nothing is reachable from the host or the internet by default.
# The web container listens on port 80 inside the Compose network, serves the site and passes /api to the API.
services:
  web:
    build:
      context: .
      dockerfile: web/Dockerfile
    restart: unless-stopped
    depends_on:
      api:
        condition: service_healthy

  api:
    build: ./backend
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      JWT_SECRET: ${JWT_SECRET:?Set JWT_SECRET in .env}
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      DASHBOARD_PASSWORD: ${DASHBOARD_PASSWORD:-}
      PGHOST: db
      PGPORT: 5432
      PGUSER: postgres
      PGPASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
      PGDATABASE: wanzhi

  db:
    image: postgres:18-alpine
    restart: unless-stopped
    environment:
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: wanzhi
    volumes:
      # Postgres 18 images keep data in a versioned folder below this path.
      - db-data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d wanzhi"]
      interval: 5s
      timeout: 3s
      retries: 20

volumes:
  db-data:
