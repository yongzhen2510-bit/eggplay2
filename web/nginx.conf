map $http_upgrade $connection_upgrade {
  default upgrade;
  ''      '';
}

server {
  listen 80;
  root /usr/share/nginx/html;
  index index.html;
  client_max_body_size 32k;

  # Traffic arrives through a reverse proxy on a private Docker network. Take the visitor address
  # from it, so rate limits apply per visitor. No port is published, so only that proxy can set this.
  set_real_ip_from 10.0.0.0/8;
  set_real_ip_from 172.16.0.0/12;
  set_real_ip_from 192.168.0.0/16;
  real_ip_header X-Forwarded-For;
  real_ip_recursive on;

  gzip on;
  gzip_types text/css application/javascript application/json image/svg+xml;

  location /api/ {
    # Resolved per request, so nginx survives the API container being recreated.
    resolver 127.0.0.11 valid=10s;
    set $api http://api:3000;
    proxy_pass $api;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection $connection_upgrade;
    # Chat sockets stay open; the API pings them every 30 seconds.
    proxy_read_timeout 90s;
  }

  # Bundles have content hashes in their names, so they can be cached for good.
  location /_expo/static/ {
    add_header Cache-Control "public, max-age=31536000, immutable";
    try_files $uri =404;
  }

  # The admin page: never cached or indexed, and locked to its own files.
  location = /dashboard {
    default_type text/html;
    add_header Cache-Control "no-store";
    add_header X-Robots-Tag "noindex, nofollow";
    add_header X-Frame-Options "DENY";
    add_header Referrer-Policy "no-referrer";
    add_header Content-Security-Policy "default-src 'none'; script-src 'self'; style-src 'self'; img-src 'self'; connect-src 'self'; base-uri 'none'; form-action 'none'; frame-ancestors 'none'";
    alias /usr/share/nginx/html/dashboard.html;
  }

  location = /manifest.webmanifest {
    default_type application/manifest+json;
    add_header Cache-Control "no-cache";
  }

  location / {
    add_header Cache-Control "no-cache";
    try_files $uri $uri/ /index.html;
  }
}
